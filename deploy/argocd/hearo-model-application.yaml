apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hearo-model
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fourdushes/ai_service01.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: hearo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
